[project]
name = "ccxt-gateway"
version = "0.1.0"
description = "A FastAPI REST and WebSocket gateway for CCXT exchanges"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "coeasy" }]
dependencies = [
  "ccxt>=4.5.93,<5",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "websockets>=13,<18",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: public read-only live exchange verification"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
package = false
